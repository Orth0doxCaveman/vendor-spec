<style>
:root{color-scheme:light dark;--bg:light-dark(#ffffff,#141110);--ink:light-dark(#1d1917,#efe9e4);--mute:light-dark(#6c625d,#a99f98);--line:light-dark(#e6e0dc,#2f2826);--card:light-dark(#f6f3f1,#1d1817);--red:#9e1f1a;--red2:light-dark(#7a1612,#c33a2f);--onred:#fff4ef}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2{font-family:Cinzel,Georgia,serif;font-weight:700;line-height:1.05;margin:0;text-wrap:balance}
.band{padding:clamp(28px,4vw,56px) max(5vw,16px)}
.top{color:var(--onred);background:linear-gradient(160deg,#b02a22 0%,#9e1f1a 45%,#6e130f 100%)}
.wrap{max-width:1240px;margin:0 auto}
h1{font-size:clamp(32px,5vw,50px)}
.sub{margin:10px 0 0;opacity:.92;max-width:62ch}
.sched{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-top:26px}
.slot{background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.18);border-radius:10px;padding:12px 14px}
.slot b{display:block;font-family:Cinzel,serif;font-size:17px}
.slot span{display:block;font-size:14px;opacity:.92}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px max(5vw,16px);max-width:1240px;margin:0 auto}
.tabs a{flex:none;text-decoration:none;color:var(--ink);padding:0 14px;border-radius:999px;border:1px solid var(--line);font-weight:600;font-size:15px;min-height:44px;display:flex;align-items:center;gap:8px}
.tabs a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs small{font-weight:500;opacity:.7}
.tabs a:focus-visible{outline:3px solid #e07a5f;outline-offset:2px}
h2{font-size:clamp(26px,3.4vw,36px)}
.meta{color:var(--mute);font-size:15px;margin:6px 0 18px}
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:900px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.board{grid-template-columns:minmax(0,1fr)}}
.col{background:var(--card);border-radius:12px;padding:12px;border:1px solid var(--line)}
.col h3{margin:2px 4px 10px;font-size:13px;font-weight:600;color:var(--mute);display:flex;justify-content:space-between}
.tag{background:var(--bg);border:1px solid var(--line);border-left:5px solid var(--c,#999);border-radius:8px;padding:9px 11px;margin-bottom:8px}
.tag strong{display:block;font-weight:600;font-size:15.5px;line-height:1.25}
.tag em{font-style:normal;font-size:13.5px;color:var(--mute)}
.tag .n{display:block;font-size:13px;color:var(--red2);margin-top:2px}
.tag.open{border-style:dashed;color:var(--mute)}
.find{display:flex;gap:8px;align-items:center;margin:0 0 18px;flex-wrap:wrap}
.find input{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:44px;width:min(320px,100%)}
.find output{color:var(--mute);font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.card h3{margin:0 0 4px;font-size:16px}.card p{margin:0 0 10px;color:var(--mute);font-size:14px}
.hb{display:grid;grid-template-columns:minmax(7em,40%) minmax(0,1fr) 2.6em;gap:8px;align-items:center;font-size:14.5px;margin:6px 0}
.hb i{display:block;height:14px;border-radius:4px;background:var(--red)}.hb b{text-align:right;font-variant-numeric:tabular-nums}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-bottom:18px}
.big div{border-top:3px solid var(--red);padding-top:8px}.big b{display:block;font-family:Cinzel,serif;font-size:clamp(28px,4vw,40px);line-height:1}.big span{font-size:14px;color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mute);margin-top:22px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--c)}
.foot{color:var(--mute);font-size:13px;margin-top:18px}
</style>

<script>
{
const RAIDS=[["10-man A","ten-a"],["10-man B","ten-b"],["10-man C","ten-c"],["20-man","twenty"],["20-man bench","bench"],["Onyxia 40","onyxia"]];
const SIZE={"10-man A":10,"10-man B":10,"10-man C":10,"20-man":20,"Onyxia 40":40};
const COLS=[["Tanks",["Tank"]],["Healers",["Healer"]],["Melee",["Melee DPS"]],["Ranged",["Ranged DPS","Open"]]];
const CC={Warrior:"#C69B6D",Paladin:"#F48CBA",Hunter:"#AAD372",Rogue:"#E8D84A",Priest:"#B8B8B8",Shaman:"#0070DD",Mage:"#3FC7EB",Warlock:"#8788EE",Druid:"#FF7C0A"};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
function csv(t){const out=[];let row=[],f="",q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else if(c==='"')q=true;else if(c===','){row.push(f);f=""}else if(c==='\n'){row.push(f);out.push(row);row=[];f=""}else if(c!=='\r')f+=c}if(f!==""||row.length){row.push(f);out.push(row)}const h=(out.shift()||[]).map(s=>s.trim());return out.filter(r=>r.some(x=>x.trim())).map(r=>Object.fromEntries(h.map((k,i)=>[k,(r[i]??"").trim()])))}
let groups=[],sched=[],live=false;
const raidOf=()=>{const h=location.hash.slice(1);return (RAIDS.find(r=>r[1]===h)||RAIDS[0])[0]};
$("legend").innerHTML=Object.entries(CC).map(([c,v])=>`<span style="--c:${v}"><i></i>${c}</span>`).join("");
const SV=JSON.parse(document.getElementById("survey").textContent);
function bars(pairs){const m=Math.max(1,...pairs.map(p=>p[1]));return pairs.map(([k,n])=>`<div class="hb"><span>${esc(k)}</span><i style="width:${n/m*100}%"></i><b>${n}</b></div>`).join("")}
function survey(){
  $("sBig").innerHTML=SV.funnel.map(([k,n])=>`<div><b>${n}</b><span>${esc(k)}</span></div>`).join("");
  const live=["10-man A","10-man B","10-man C","20-man"].map(r=>[r,groups.filter(s=>s.Raid===r&&s.Character).length]);
  const C=[["Roles people asked for","Main role chosen in the survey, all answers.",SV.want],
  ["Raid roster by role","Players who will be 50+ by 9 December.",SV.roster],
  ["How close to 60","The raid roster today. Keep levelling, there's time.",SV.levels],
  ["Classes in the raid roster","Lots of Shamans. Warlocks and Rogues are wanted.",SV.classes],
  ["Preferred start time (server time)","All answers. Most picked 20:00, so raids start at 20:00.",SV.start],
  ["Nights you can raid","All answers. 10-mans on Friday, the 20-man on Saturday.",SV.nights],
  ["Raid experience","All answers. First raid? You're in good company.",SV.exp],
  ["Crafters in the raid roster","Enchanters and alchemists: talk to them about consumables.",SV.prof],
  ["Happy to switch spec if needed","Raid roster players with a second spec.",SV.flex],
  ["Players placed in groups","Live from the officers' sheet.",live]];
  $("sCards").innerHTML=C.map(([h,p,d])=>`<div class="card"><h3>${esc(h)}</h3><p>${esc(p)}</p>${bars(d)}</div>`).join("");
}
function render(){
  const isS=location.hash==="#survey";$("raidView").hidden=isS;$("surveyView").hidden=!isS;if(isS)survey();
  const raid=raidOf(),list=groups.filter(s=>s.Raid===raid).sort((a,b)=>(+a.Order||0)-(+b.Order||0));
  const msg=sched.find(s=>s.Raid==="Message");$("startline").textContent=msg?msg.Night:"";
  $("sched").innerHTML=sched.filter(s=>s.Raid!=="Message").map(s=>`<div class="slot"><b>${esc(s.Raid)}</b><span>${esc(s.Night)}${s.Start?" · "+esc(s.Start):""}</span><span>Lead: ${esc(s["Raid leader"]||"TBC")}</span></div>`).join("");
  $("tabs").innerHTML=RAIDS.map(([n,h])=>{const c=groups.filter(s=>s.Raid===n&&s.Character).length;return `<a href="#${h}" ${n===raid&&!isS?'aria-current="page"':""}>${esc(n)} <small>${c}${SIZE[n]?"/"+SIZE[n]:""}</small></a>`}).join("")+`<a href="#survey" ${isS?'aria-current="page"':""}>Survey results</a>`;
  const sc=sched.find(s=>s.Raid===raid)||{},filled=list.filter(s=>s.Character),cnt=r=>filled.filter(s=>s.Role===r).length;
  $("rname").textContent=raid;
  $("rmeta").textContent=[sc.Night||list[0]?.Night,sc.Start,sc["Raid leader"]?"Raid leader: "+sc["Raid leader"]:"",`${filled.length}${SIZE[raid]?" of "+SIZE[raid]:""} players · ${cnt("Tank")} tanks · ${cnt("Healer")} healers · ${cnt("Melee DPS")+cnt("Ranged DPS")} DPS`].filter(Boolean).join("  ·  ");
  $("board").innerHTML=COLS.map(([t,rs])=>{const items=list.filter(s=>rs.includes(s.Role));return `<section class="col"><h3><span>${t}</span><span>${items.filter(s=>s.Character).length}</span></h3>${items.map(s=>s.Character?`<div class="tag" style="--c:${CC[s.Class]||"#999"}"><strong>${esc(s.Character)}</strong><em>${esc(s.Class)}${s.Spec?" · "+esc(s.Spec):""}</em>${s.Note?`<span class="n">${esc(s.Note)}</span>`:""}</div>`:`<div class="tag open"><strong>Open slot</strong><em>${esc(s.Note)}</em></div>`).join("")||'<div class="meta" style="padding:4px;margin:0">—</div>'}</section>`}).join("");
  $("foot").textContent=live?"Live from the officers' sheet.":"Showing the saved snapshot of 26 Nov.";
  who();
}
function who(){const q=$("who").value.trim().toLowerCase();if(!q){$("whoOut").textContent="";return}const m=groups.filter(s=>s.Character.toLowerCase().includes(q));$("whoOut").textContent=m.length?[...new Set(m.map(s=>s.Character))].slice(0,3).map(n=>n+": "+m.filter(s=>s.Character===n).map(s=>s.Raid).join(", ")).join(" · "):"Not in any group yet."}
$("who").addEventListener("input",who);window.addEventListener("hashchange",render);
const snap=JSON.parse($("snap").textContent);groups=snap.groups;sched=snap.schedule;render();
if(GROUPS_CSV&&SCHEDULE_CSV){Promise.all([GROUPS_CSV,SCHEDULE_CSV].map(u=>fetch(u,{cache:"no-store"}).then(r=>{if(!r.ok)throw 0;return r.text()}))).then(([g,s])=>{const G=csv(g),S=csv(s);if(G.length){groups=G;sched=S;live=true;render()}}).catch(()=>{$("foot").textContent="Couldn't reach the officers' sheet, showing the saved snapshot."})}
}
